<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POO en C# para Unity — Refuerzo</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- SweetAlert2 for unlock notifications -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
</head>
<body>

  <!-- ═══ Header ═══════════════════════════════════════════════════════════ -->
  <header id="app-header">
    <div class="header-left">
      <h1>🎮 POO en C# para Unity</h1>
    </div>
    <div style="display:flex;gap:0.5rem;align-items:center;">
      <button id="btn-help" title="Instrucciones">Ayuda?</button>
      <button id="btn-bug"  title="Reportar un bug">🐛 Bug</button>
    </div>
    <div class="header-right">
      <span id="user-email" class="user-email" title=""></span>
      <button id="btn-reset" title="Reiniciar todo el progreso">↺ Reset</button>
    </div>
  </header>

  <!-- ═══ Main Layout ═══════════════════════════════════════════════════════ -->
  <main id="app-main">

    <!-- Left: Section Navigator -->
    <aside id="sidebar" aria-label="Navegación de secciones">
      <h2>Secciones<button id="btn-toggle-sidebar" class="panel-toggle-btn" title="Colapsar secciones" aria-label="Colapsar secciones">◀</button></h2>
      <nav id="sections-nav" role="navigation" aria-label="Secciones del curso">
        <!-- Populated dynamically by SidebarManager -->
      </nav>
    </aside>

    <!-- Center: Evaluation -->
    <section id="evaluation-panel" aria-label="Panel de evaluación">
      <!-- Active question -->
      <div id="current-question-container" aria-live="polite">
        <!-- Populated by EvaluationPanel -->
      </div>
      <!-- History of answered questions this session -->
      <div id="topic-questions-container" aria-label="Preguntas respondidas">
        <!-- Populated by EvaluationPanel -->
      </div>
    </section>

    <!-- Right: Documentation -->
    <aside id="documentation-panel" aria-label="Documentación del curso">
      <h2><button id="btn-toggle-docs" class="panel-toggle-btn" title="Colapsar documentación" aria-label="Colapsar documentación">▶</button>📚 Documentación</h2>
      <div id="documentation-content">
        <p class="doc-placeholder">
          Responde preguntas correctamente para desbloquear la documentación de cada sección.
        </p>
      </div>
    </aside>

  </main>

  <!-- ═══ Panel Restore Buttons (desktop) ════════════════════════════════ -->
  <button id="btn-restore-sidebar" class="panel-restore-btn panel-restore-left"  title="Mostrar secciones">▶</button>
  <button id="btn-restore-docs"    class="panel-restore-btn panel-restore-right" title="Mostrar documentación">◀</button>

  <!-- ═══ Mobile Navigation Bar ════════════════════════════════════════════ -->
  <nav id="mobile-nav" aria-label="Navegación móvil">
    <button data-panel="sidebar" aria-label="Secciones">
      <span>📋</span>
      <span>Secciones</span>
    </button>
    <button data-panel="evaluation" class="active" aria-label="Evaluación">
      <span>🎮</span>
      <span>Evaluación</span>
    </button>
    <button data-panel="docs" aria-label="Documentación">
      <span>📚</span>
      <span>Docs</span>
    </button>
  </nav>

  <!-- ═══ Loading Overlay ═══════════════════════════════════════════════════ -->
  <div id="loading-overlay" role="status" aria-label="Cargando curso">
    <div class="loading-spinner"></div>
    <p>Cargando curso…</p>
  </div>

  <!-- Help modal — SweetAlert2 -->
  <script>
    document.getElementById('btn-help').addEventListener('click', () => {
      Swal.fire({
        title: '📖 Instrucciones',
        html: `
          <ul style="text-align:left;padding-left:1.2rem;line-height:1.8;margin:0">
            <li>Responde las preguntas para <strong>desbloquear temas</strong>.</li>
            <li>Cada sección tiene <strong>20 preguntas</strong> pero solo debes responder <strong>5 correctas</strong> para pasar al siguiente nivel.</li>
            <li>Al final de cada sección hay un <strong>examen final de 20 preguntas</strong>.</li>
            <li>Puedes navegar en la <strong>documentación de la derecha</strong> en todo momento.</li>
          </ul>`,
        confirmButtonText: 'Entendido',
      });
    });
  </script>

  <!-- Bug report modal — Web3Forms -->
  <script>
    const BUG_ACCESS_KEY = '9c20ede2-cd21-42dd-be82-a26dd6832f08';

    document.getElementById('btn-bug').addEventListener('click', () => {
      Swal.fire({
        title: '🐛 Reportar Bug',
        html: `
          <div class="bug-form">
            <label for="swal-bug-type">Tipo de bug</label>
            <select id="swal-bug-type">
              <option value="">— Selecciona un tipo —</option>
              <option value="Funcionalidad">Funcionalidad</option>
              <option value="Respuesta a preguntas">Respuesta a preguntas</option>
              <option value="Acceso">Acceso</option>
              <option value="Otro">Otro</option>
            </select>

            <label for="swal-bug-desc">Descripción del bug</label>
            <textarea id="swal-bug-desc" rows="4"
              placeholder="Describe el problema con el mayor detalle posible…"></textarea>

            <p class="bug-disclaimer">
              ⚠️ Los bugs serán revisados en un lapso menor de 2 días.
              Reportes falsos o bromas de issues podrán revocar tu acceso a la aplicación.
            </p>
          </div>`,
        confirmButtonText: 'Enviar reporte',
        showCancelButton: true,
        cancelButtonText: 'Cancelar',
        focusConfirm: false,
        preConfirm: async () => {
          const type = document.getElementById('swal-bug-type').value;
          const desc = document.getElementById('swal-bug-desc').value.trim();
          if (!type) {
            Swal.showValidationMessage('Selecciona un tipo de bug.');
            return false;
          }
          if (desc.length < 10) {
            Swal.showValidationMessage('La descripción debe tener al menos 10 caracteres.');
            return false;
          }
          try {
            const res = await fetch('https://api.web3forms.com/submit', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                access_key: BUG_ACCESS_KEY,
                subject: `[Bug] ${type} — RefuerzoProgra`,
                from_name: 'RefuerzoProgra',
                message: `Tipo: ${type}\n\nDescripción:\n${desc}`,
              }),
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.message || 'Error desconocido');
            return true;
          } catch (err) {
            Swal.showValidationMessage(`No se pudo enviar: ${err.message}`);
            return false;
          }
        },
      }).then(result => {
        if (result.isConfirmed) {
          Swal.fire({
            icon: 'success',
            title: '¡Reporte enviado!',
            text: 'Gracias. Revisaremos el problema en menos de 2 días.',
            confirmButtonText: 'Cerrar',
          });
        }
      });
    });
  </script>

  <!-- Desktop panel toggles & mobile nav -->
  <script>
    const appMain = document.getElementById('app-main');
    const sidebarEl = document.getElementById('sidebar');
    const docsEl   = document.getElementById('documentation-panel');
    const evalEl   = document.getElementById('evaluation-panel');
    const restoreSidebar = document.getElementById('btn-restore-sidebar');
    const restoreDocs    = document.getElementById('btn-restore-docs');

    // ── Desktop: sidebar toggle ──────────────────────────────────────────
    document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
      const collapsed = appMain.classList.toggle('sidebar-collapsed');
      restoreSidebar.style.display = collapsed ? 'block' : 'none';
    });
    restoreSidebar.addEventListener('click', () => {
      appMain.classList.remove('sidebar-collapsed');
      restoreSidebar.style.display = 'none';
    });

    // ── Desktop: docs toggle ─────────────────────────────────────────────
    document.getElementById('btn-toggle-docs').addEventListener('click', () => {
      const collapsed = appMain.classList.toggle('docs-collapsed');
      restoreDocs.style.display = collapsed ? 'block' : 'none';
    });
    restoreDocs.addEventListener('click', () => {
      appMain.classList.remove('docs-collapsed');
      restoreDocs.style.display = 'none';
    });

    // ── Mobile: bottom nav ───────────────────────────────────────────────
    const MOBILE_BP = 600;
    const mobileNavBtns = document.querySelectorAll('#mobile-nav [data-panel]');
    const panelMap = { sidebar: sidebarEl, evaluation: evalEl, docs: docsEl };

    function isMobile() { return window.innerWidth <= MOBILE_BP; }

    function switchMobilePanel(key) {
      Object.entries(panelMap).forEach(([k, el]) => {
        el.style.display = k === key ? 'flex' : 'none';
      });
    }

    mobileNavBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        mobileNavBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (isMobile()) switchMobilePanel(btn.dataset.panel);
      });
    });

    // Reset inline styles when resizing back to desktop
    window.addEventListener('resize', () => {
      if (!isMobile()) {
        Object.values(panelMap).forEach(el => (el.style.display = ''));
      }
    });
  </script>

  <!-- App entry point — type="module" enables ES6 imports -->
  <script type="module" src="js/app.js?v=8"></script>

</body>
</html>
