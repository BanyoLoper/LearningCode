# Wrangler config for local dev + Cloudflare Pages.
#
# Environments:
#   - top-level [d1_databases]    → Production (main branch)
#   - [env.preview.*]             → All non-production branches (feature/* etc.)
#
# Secrets (SESSION_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET) live in
# the Pages dashboard → Settings → Environment variables (encrypted), since
# they must NOT be committed.
#
# Local dev reads variables from .dev.vars (also gitignored).
#
# Useful commands:
#   npx wrangler pages dev .
#   npx wrangler d1 execute refuerzo-progra-db --file=db/schema.sql --local
#   npx wrangler d1 execute refuerzo-progra-db --file=db/schema.sql --remote

name                   = "refuerzo-progra"
compatibility_date     = "2025-04-01"
pages_build_output_dir = "."

# ─── Production (main branch) ────────────────────────────────────────────────
# Bindings only — no public vars yet. Production stays behind Cloudflare Access
# until we cut over in FASE B.

[[d1_databases]]
binding       = "DB"
database_name = "refuerzo-progra-db"
database_id   = "b44f68d8-b612-4aa0-8215-cac27a253a05"

# ─── Preview (feat/paywall and other feature branches) ──────────────────────
# Public, non-secret variables for the paywall preview environment.

[env.preview.vars]
APP_URL                = "https://feat-paywall.gamingcode.pages.dev"
MAIL_FROM              = "noreply@bny.agency"
MAIL_FROM_NAME         = "Refuerzo Progra"
ADMIN_EMAIL            = "spotdoggames@gmail.com"
MAGIC_LINK_TTL_MINUTES = "15"
STRIPE_PRICE_ID        = "price_1TSFq40qSw2OszNusQP7XAFx"

[[env.preview.d1_databases]]
binding       = "DB"
database_name = "refuerzo-progra-db"
database_id   = "b44f68d8-b612-4aa0-8215-cac27a253a05"
